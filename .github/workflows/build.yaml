name: Sync Node base image to GitHub Container Registry

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC

permissions:
  packages: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - BASE_IMAGE: "node:26-trixie-slim"
            TAG_VERSION: "26"
          - BASE_IMAGE: "node:26.12-trixie-slim"
            TAG_VERSION: "26.12"
          # Node 24 (Active LTS)
          - BASE_IMAGE: "node:24-bookworm-slim"
            TAG_VERSION: "24"
          - BASE_IMAGE: "node:24.22-bookworm-slim"
            TAG_VERSION: "24.22"
          # Node 22 (Maintenance LTS)
          - BASE_IMAGE: "node:22-bookworm-slim"
            TAG_VERSION: "22"
          - BASE_IMAGE: "node:22.23-bookworm-slim"
            TAG_VERSION: "22.23"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' || github.event_name == 'schedule' }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/node:${{ matrix.TAG_VERSION }}
          build-args: |
            BASE_IMAGE=${{ matrix.BASE_IMAGE }}
          cache-from: type=gha,scope=${{ matrix.TAG_VERSION }}
          cache-to: type=gha,mode=max,scope=${{ matrix.TAG_VERSION }}

      # Scans what was just pushed, by digest. Syft reads the registry login from
      # the step above. No DT secret in this job: it builds repo content.
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        id: syft
        if: github.ref == 'refs/heads/main' || github.event_name == 'schedule'

      - name: Generate SBOM
        if: github.ref == 'refs/heads/main' || github.event_name == 'schedule'
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/node@${{ steps.build.outputs.digest }}
          TAG_VERSION: ${{ matrix.TAG_VERSION }}
        run: |
          set -euo pipefail
          "$SYFT" "$IMAGE" --platform linux/amd64 \
            --source-name node \
            --source-version "$TAG_VERSION" \
            -o cyclonedx-json@1.6="${TAG_VERSION}.cdx.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref == 'refs/heads/main' || github.event_name == 'schedule'
        with:
          name: sbom-${{ matrix.TAG_VERSION }}
          path: ${{ matrix.TAG_VERSION }}.cdx.json
          retention-days: 7

  build-min:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Docker Hardened Images (dhi.io)
          - TARGET: "dev"
            DHI_TAG: "26-debian13"
            TAG_VERSION: "26-min-dev"
          - TARGET: "runtime"
            DHI_TAG: "26-debian13"
            TAG_VERSION: "26-min"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hardened Images
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.dhi
          target: ${{ matrix.TARGET }}
          push: ${{ github.ref == 'refs/heads/main' || github.event_name == 'schedule' }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/node:${{ matrix.TAG_VERSION }}
          build-args: |
            DHI_TAG=${{ matrix.DHI_TAG }}
          cache-from: type=gha,scope=${{ matrix.TAG_VERSION }}
          cache-to: type=gha,mode=max,scope=${{ matrix.TAG_VERSION }}

      # Scans what was just pushed, by digest. Syft reads the registry login from
      # the step above. No DT secret in this job: it builds repo content.
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        id: syft
        if: github.ref == 'refs/heads/main' || github.event_name == 'schedule'

      - name: Generate SBOM
        if: github.ref == 'refs/heads/main' || github.event_name == 'schedule'
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/node@${{ steps.build.outputs.digest }}
          TAG_VERSION: ${{ matrix.TAG_VERSION }}
        run: |
          set -euo pipefail
          "$SYFT" "$IMAGE" --platform linux/amd64 \
            --source-name node \
            --source-version "$TAG_VERSION" \
            -o cyclonedx-json@1.6="${TAG_VERSION}.cdx.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref == 'refs/heads/main' || github.event_name == 'schedule'
        with:
          name: sbom-${{ matrix.TAG_VERSION }}
          path: ${{ matrix.TAG_VERSION }}.cdx.json
          retention-days: 7

  # Separate job so the DT key is never present while the images are built.
  dependencytrack:
    needs: [build, build-min]
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sbom-*
          merge-multiple: true

      # One DT version per image tag under "0 - Base Images" > "NodeJS". The tags
      # roll, so a weekly run replaces that version's BOM. projectTags=main puts
      # every version in the NodeJS container's rollup.
      - name: Upload SBOMs to DependencyTrack
        env:
          DT_API_KEY: ${{ secrets.DEPENDENCYTRACK_OSS_APIKEY }}
          DT_URL: https://dependencytrack-api.labdigital.nl:8443
          PROJECT: NodeJS
        run: |
          set -euo pipefail
          if [ -z "${DT_API_KEY}" ]; then
            echo "::error::DEPENDENCYTRACK_OSS_APIKEY is not available to this repo"
            exit 1
          fi
          shopt -s nullglob
          files=(*.cdx.json)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no SBOM files downloaded"
            exit 1
          fi
          for f in "${files[@]}"; do
            version="${f%.cdx.json}"
            echo "Uploading ${PROJECT} ${version}"
            curl -sS --fail-with-body -X POST "${DT_URL}/api/v1/bom" \
              -H "X-Api-Key: ${DT_API_KEY}" \
              -F "autoCreate=true" \
              -F "projectName=${PROJECT}" \
              -F "projectVersion=${version}" \
              -F "parentName=${PROJECT}" \
              -F "projectTags=main" \
              -F "bom=@${f}"
          done
