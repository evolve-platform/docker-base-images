name: Sync Node base image to GitHub Container Registry

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC

permissions:
  packages: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - BASE_IMAGE: "node:26-trixie-slim"
            TAG_VERSION: "26"
          - BASE_IMAGE: "node:26.3-trixie-slim"
            TAG_VERSION: "26.3"
          # Node 24 (Active LTS)
          - BASE_IMAGE: "node:24-bookworm-slim"
            TAG_VERSION: "24"
          - BASE_IMAGE: "node:24.15-bookworm-slim"
            TAG_VERSION: "24.15"
          - BASE_IMAGE: "node:24.14-bookworm-slim"
            TAG_VERSION: "24.14"
          - BASE_IMAGE: "node:24.13-bookworm-slim"
            TAG_VERSION: "24.13"
          # Node 22 (Maintenance LTS)
          - BASE_IMAGE: "node:22-bookworm-slim"
            TAG_VERSION: "22"
          - BASE_IMAGE: "node:22.22-bookworm-slim"
            TAG_VERSION: "22.22"
          - BASE_IMAGE: "node:22.14-bookworm-slim"
            TAG_VERSION: "22.14"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' || github.event_name == 'schedule' }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/node:${{ matrix.TAG_VERSION }}
          build-args: |
            BASE_IMAGE=${{ matrix.BASE_IMAGE }}
          cache-from: type=gha,scope=${{ matrix.TAG_VERSION }}
          cache-to: type=gha,mode=max,scope=${{ matrix.TAG_VERSION }}
